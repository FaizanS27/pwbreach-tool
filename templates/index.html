<!DOCTYPE html>
<html>
<head>
    <title>Password Security Checker</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 60px auto; padding: 20px; }
        input[type=text] { width: 100%; padding: 10px; font-size: 16px; box-sizing: border-box; }
        button { padding: 10px 20px; font-size: 16px; margin-top: 10px; cursor: pointer; }
        .result { margin-top: 30px; padding: 20px; border-radius: 8px; }
        .STRONG { background: #e8f8f5; border: 1px solid #02c39a; }
        .COMPROMISED { background: #fdedea; border: 1px solid #c0392b; }
        .WEAK { background: #fdf3e7; border: 1px solid #e8a33d; }
        table { width: 100%; margin-top: 10px; }
        td { padding: 4px 0; }
    </style>
</head>
<body>
    <h1>Password Security Checker</h1>
    <form method="POST">
        <label for="password">Enter a password to check:</label><br><br>
        <input type="text" name="password" id="password" placeholder="Type a password..." required>
        <br>
        <button type="submit">Check Password</button>
    </form>

    {% if result %}
    <div class="result {{ 'WEAK' if 'WEAK' in result.verdict else result.verdict }}">
        <h2>Verdict: {{ result.verdict }}</h2>
        <p>{{ result.message }}</p>
        <table>
            <tr><td><strong>Entropy:</strong></td><td>{{ result.entropy_bits }} bits</td></tr>
            <tr><td><strong>zxcvbn score:</strong></td><td>{{ result.zxcvbn_score }} / 4</td></tr>
            <tr><td><strong>Found in common list:</strong></td><td>{{ result.in_common_list }}</td></tr>
            <tr><td><strong>Breach count:</strong></td><td>{{ result.hibp_breach_count }}</td></tr>
        </table>
    </div>
    {% endif %}
</body>
</html>
